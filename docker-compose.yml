services:
    api:
        build: ./apps/api
        ports:
            - "4000:4000"
        env_file:
            - ./apps/api/.env
        volumes:
            - ./apps/api/prisma:/app/prisma
        restart: unless-stopped

    web:
        build:
            context: ./apps/web
            args:
                VITE_API_URL: http://localhost:4000/api
        ports:
            - "5173:4173"
        depends_on:
            - api
        restart: unless-stopped
